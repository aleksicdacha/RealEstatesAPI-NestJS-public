# 🚀 Server Deployment & Startup Guide

## Files are on server - Now what?

This guide covers:
1. **Starting applications on production server**
2. **Development vs Production differences**
3. **Automated deployment from GitHub**
4. **CI/CD setup for automatic deployments**

---

## 📋 Part 1: Starting Applications on Server (Production)

### Step 1: Configure Environment Variables

```bash
cd ~/RealEstatesAPI-NestJS

# Create production environment file for API
cp apps/api/.env.example apps/api/.env
nano apps/api/.env
```

**Configure these critical values:**

```env
# Database (PostgreSQL will run in Docker)
DB_HOST=localhost
DB_PORT=5432
DB_USERNAME=estates_user
DB_PASSWORD=CHANGE_THIS_TO_STRONG_PASSWORD
DB_NAME=estates_prod
DB_SYNC=false  # IMPORTANT: false in production!

# Security
JWT_SECRET=CHANGE_THIS_TO_32_CHAR_RANDOM_STRING
NODE_ENV=production

# Server
PORT=3000

# CORS - Replace with your actual domain
CORS_ORIGIN=https://yourdomain.com,https://admin.yourdomain.com

# Optional APIs
GEMINI_API_KEY=your_gemini_key_here
GOOGLE_MAPS_API_KEY=your_google_maps_key
```

**Generate secure secrets:**
```bash
# Generate JWT secret
openssl rand -base64 32

# Generate DB password
openssl rand -base64 24
```

**Create frontend environment files:**

```bash
# User Web
nano apps/user-web/.env.local
```

```env
NEXT_PUBLIC_API_URL=http://localhost:3000/v1
NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=your_key_here
```

```bash
# Admin Web
nano apps/admin-web/.env.local
```

```env
NEXT_PUBLIC_API_URL=http://localhost:3000/v1
```

---

### Step 2: Start Database

```bash
cd ~/RealEstatesAPI-NestJS

# Start PostgreSQL with Docker
docker compose up -d postgres

# Wait for it to initialize (10 seconds)
sleep 10

# Verify it's running
docker ps
```

---

### Step 3: Install Dependencies

```bash
cd ~/RealEstatesAPI-NestJS

# Install root dependencies
npm install

# Build shared packages (CRITICAL!)
cd packages/types
npm run build
cd ../..

# Verify build
ls -la packages/types/dist
```

---

### Step 4: Run Database Migrations

```bash
cd ~/RealEstatesAPI-NestJS/apps/api

# Run migrations
npm run migration:run

# Create admin user
npm run seed:users
```

**Default admin credentials** (see `documentation/ADMIN_CREDENTIALS.md`):
- Email: `admin@example.com`
- Password: `admin123` (change immediately!)

---

### Step 5: Build Applications

```bash
cd ~/RealEstatesAPI-NestJS

# Build all apps
npm run build

# This builds:
# - apps/api (NestJS)
# - apps/admin-web (Next.js)
# - apps/user-web (Next.js)
```

**Verify builds:**
```bash
ls -la apps/api/dist
ls -la apps/admin-web/.next
ls -la apps/user-web/.next
```

---

### Step 6: Start with PM2 (Production Process Manager)

```bash
# Install PM2 globally
sudo npm install -g pm2

# Start API
cd ~/RealEstatesAPI-NestJS/apps/api
pm2 start dist/main.js --name "realestates-api" --env production

# Start Admin Web
cd ~/RealEstatesAPI-NestJS/apps/admin-web
pm2 start npm --name "realestates-admin" -- start

# Start User Web
cd ~/RealEstatesAPI-NestJS/apps/user-web
pm2 start npm --name "realestates-user" -- start

# View status
pm2 status

# View logs
pm2 logs

# Save PM2 configuration
pm2 save

# Setup PM2 to start on boot
pm2 startup
# Follow the command it prints!
```

---

### Step 7: Verify Applications

```bash
# Check PM2 status
pm2 status

# Test API
curl http://localhost:3000/v1/properties/public

# Test Admin Web
curl http://localhost:3001

# Test User Web
curl http://localhost:3002

# View logs
pm2 logs realestates-api --lines 50
```

