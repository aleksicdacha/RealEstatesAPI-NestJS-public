## 🤖 Part 3: Automated Deployment Setup

### Option A: Simple Git Pull Script

Create deployment script on server:

```bash
nano ~/deploy.sh
```

```bash
#!/bin/bash

echo "🚀 Deploying Real Estate Platform..."

# Navigate to project
cd ~/RealEstatesAPI-NestJS

# Pull latest changes
echo "📥 Pulling from GitHub..."
git pull origin main

# Install dependencies
echo "📦 Installing dependencies..."
npm install

# Build shared packages
echo "🔧 Building shared packages..."
cd packages/types
npm run build
cd ../..

# Run migrations
echo "🗄️ Running migrations..."
cd apps/api
npm run migration:run
cd ../..

# Build all apps
echo "🏗️ Building applications..."
npm run build

# Restart PM2 processes
echo "🔄 Restarting applications..."
pm2 restart all

# Show status
echo "✅ Deployment complete!"
pm2 status

# Show logs
pm2 logs --lines 20
```

**Make executable and use:**

```bash
chmod +x ~/deploy.sh

# Deploy anytime:
./deploy.sh
```

---

### Option B: GitHub Actions CI/CD (Automated)

Create this file in your project: `.github/workflows/deploy.yml`

<function_calls>
<invoke name="create_file">
<parameter name="content">name: Deploy to Production

on:
  push:
    branches:
      - main  # Triggers on push to main branch
  workflow_dispatch:  # Allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/RealEstatesAPI-NestJS
            
            # Pull latest changes
            git pull origin main
            
            # Install dependencies
            npm install
            
            # Build shared packages
            cd packages/types
            npm run build
            cd ../..
            
            # Run migrations
            cd apps/api
            npm run migration:run
            cd ../..
            
            # Build all applications
            npm run build
            
            # Restart PM2 processes
            pm2 restart all
            
            # Show status
            pm2 status

      - name: ✅ Deployment complete
        run: echo "Deployment successful!"
