## 🔄 Part 2: Development vs Production Setup

### Differences:

| Aspect | Development (Local) | Production (Server) |
|--------|---------------------|---------------------|
| **Start Command** | `npm run dev` | `npm run build` → `pm2 start` |
| **Hot Reload** | ✅ Yes | ❌ No |
| **DB_SYNC** | `true` (auto schema) | `false` (migrations only) |
| **NODE_ENV** | `development` | `production` |
| **Process Manager** | Node directly | PM2 |
| **Port Exposure** | Direct | Behind Nginx |
| **CORS** | `http://localhost:*` | Your domain |
| **Error Details** | Full stack traces | Hidden |
| **Source Maps** | Yes | No |

