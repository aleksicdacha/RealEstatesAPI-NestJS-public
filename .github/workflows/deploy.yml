name: Test & Deploy RealEstates to Hetzner

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Run tests
        working-directory: apps/api
        run: npm run test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 30

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: estates
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d estates"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Install admin-web dependencies
        working-directory: apps/admin-web
        run: npm ci

      - name: Install user-web dependencies
        working-directory: apps/user-web
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create API env file
        run: |
          cat > apps/api/.env << 'EOF'
          NODE_ENV=test
          DB_HOST=localhost
          DB_PORT=5432
          DB_USERNAME=postgres
          DB_PASSWORD=postgres
          DB_NAME=estates
          JWT_SECRET=ci-test-secret-key-minimum-32-characters-long
          JWT_EXPIRES_IN=30m
          JWT_REFRESH_SECRET=ci-test-refresh-secret-key-minimum-32-chars
          JWT_REFRESH_EXPIRES_IN=7d
          REDIS_HOST=localhost
          REDIS_PORT=6379
          PORT=3000
          CORS_ORIGIN=http://localhost:3001,http://localhost:3002
          THROTTLE_SKIP=true
          EOF

      - name: Create admin-web env file
        run: |
          echo "NEXT_PUBLIC_API_URL=http://localhost:3000" > apps/admin-web/.env.local

      - name: Create user-web env file
        run: |
          echo "NEXT_PUBLIC_API_URL=http://localhost:3000/v1" > apps/user-web/.env.local

      - name: Build API
        working-directory: apps/api
        run: npx nest build

      - name: Start API
        run: |
          cd apps/api && node dist/main.js &
          echo "API PID: $!"
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: estates
          JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
          JWT_EXPIRES_IN: 30m
          JWT_REFRESH_SECRET: ci-test-refresh-secret-key-minimum-32-chars
          JWT_REFRESH_EXPIRES_IN: 7d
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          PORT: 3000
          CORS_ORIGIN: http://localhost:3001,http://localhost:3002
          THROTTLE_SKIP: 'true'

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:3000/v1/properties/public?page=1&limit=1" > /dev/null 2>&1; then
              echo "✅ API ready"; break
            fi
            echo "Waiting for API ($i/30)..."; sleep 2
          done

      - name: Seed database
        run: npm run seed
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: estates

      - name: Build admin-web
        working-directory: apps/admin-web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: Start admin-web
        run: cd apps/admin-web && PORT=3001 npm run start &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: Build user-web
        working-directory: apps/user-web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/v1

      - name: Start user-web
        run: cd apps/user-web && PORT=3002 npm run start &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/v1

      - name: Wait for frontends
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001 > /dev/null 2>&1 && echo "✅ admin-web ready" && break
            echo "Waiting for admin-web ($i/30)..."; sleep 2
          done
          for i in $(seq 1 30); do
            curl -sf http://localhost:3002 > /dev/null 2>&1 && echo "✅ user-web ready" && break
            echo "Waiting for user-web ($i/30)..."; sleep 2
          done

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: 'true'
          API_URL: http://127.0.0.1:3000/v1/
          ADMIN_URL: http://127.0.0.1:3001
          USER_URL: http://127.0.0.1:3002
          TEST_ADMIN_EMAIL: admin
          TEST_ADMIN_PASSWORD: admin123

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/reports/
          retention-days: 30

      - name: Upload test traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='.env.production' \
            --exclude='uploads' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/root/RealEstatesAPI-NestJS/

      - name: Build and restart Docker containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            cd /root/RealEstatesAPI-NestJS
            docker compose -f docker-compose.prod.yml build api admin-web user-web
            docker compose -f docker-compose.prod.yml up -d
            sleep 10
            docker compose -f docker-compose.prod.yml ps

      - name: Verify API health
        run: |
          sleep 15
          curl -sf "http://${{ secrets.HETZNER_HOST }}:8090/v1/properties/public?page=1&limit=1" \
            && echo "✅ API healthy" \
            || echo "⚠️ API health check failed"
