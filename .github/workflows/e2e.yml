name: E2E Tests

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: estates
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d estates"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Install admin-web dependencies
        working-directory: apps/admin-web
        run: npm ci

      - name: Install user-web dependencies
        working-directory: apps/user-web
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # ── Create env files ────────────────────────────────────────────────────
      - name: Create API env file
        run: |
          cat > apps/api/.env << 'EOF'
          NODE_ENV=test
          DB_HOST=localhost
          DB_PORT=5432
          DB_USERNAME=postgres
          DB_PASSWORD=postgres
          DB_NAME=estates
          JWT_SECRET=ci-test-secret-key-minimum-32-characters-long
          JWT_EXPIRES_IN=30m
          JWT_REFRESH_SECRET=ci-test-refresh-secret-key-minimum-32-characters
          JWT_REFRESH_EXPIRES_IN=7d
          REDIS_HOST=localhost
          REDIS_PORT=6379
          PORT=3000
          CORS_ORIGIN=http://localhost:3001,http://localhost:3002
          THROTTLE_SKIP=true
          EOF

      - name: Create admin-web env file
        run: |
          cat > apps/admin-web/.env.local << 'EOF'
          NEXT_PUBLIC_API_URL=http://localhost:3000
          EOF

      - name: Create user-web env file
        run: |
          cat > apps/user-web/.env.local << 'EOF'
          NEXT_PUBLIC_API_URL=http://localhost:3000/v1
          EOF

      # ── Run migrations & seed ───────────────────────────────────────────────
      - name: Install migration dependencies
        working-directory: apps/api
        run: npm install --no-save tsconfig-paths ts-node

      - name: Run database migrations
        working-directory: apps/api
        run: |
          node \
            -r $GITHUB_WORKSPACE/apps/api/node_modules/tsconfig-paths/register \
            -r $GITHUB_WORKSPACE/apps/api/node_modules/ts-node/register \
            $GITHUB_WORKSPACE/node_modules/typeorm/cli.js \
            migration:run -d src/data-source.ts
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: estates

      - name: Seed database
        run: npm run seed
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: estates

      # ── Build & start apps ──────────────────────────────────────────────────
      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Start API
        working-directory: apps/api
        run: node dist/main.js &
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: estates
          JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
          JWT_EXPIRES_IN: 30m
          JWT_REFRESH_SECRET: ci-test-refresh-secret-key-minimum-32-characters
          JWT_REFRESH_EXPIRES_IN: 7d
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          PORT: 3000
          CORS_ORIGIN: http://localhost:3001,http://localhost:3002
          THROTTLE_SKIP: 'true'

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/v1/properties/public?page=1&limit=1 > /dev/null 2>&1; then
              echo "✅ API is ready"
              break
            fi
            echo "Attempt $i/30..."
            sleep 2
          done

      - name: Build admin-web
        working-directory: apps/admin-web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: Start admin-web
        working-directory: apps/admin-web
        run: npm run start &
        env:
          PORT: 3001
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: Build user-web
        working-directory: apps/user-web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/v1

      - name: Start user-web
        working-directory: apps/user-web
        run: npm run start &
        env:
          PORT: 3002
          NEXT_PUBLIC_API_URL: http://localhost:3000/v1

      - name: Wait for frontends to be ready
        run: |
          echo "Waiting for admin-web on :3001..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001 > /dev/null 2>&1; then
              echo "✅ admin-web ready"
              break
            fi
            sleep 2
          done
          echo "Waiting for user-web on :3002..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3002 > /dev/null 2>&1; then
              echo "✅ user-web ready"
              break
            fi
            sleep 2
          done

      # ── Run Playwright ──────────────────────────────────────────────────────
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: 'true'
          API_URL: http://127.0.0.1:3000/v1/
          ADMIN_URL: http://127.0.0.1:3001
          USER_URL: http://127.0.0.1:3002
          TEST_ADMIN_EMAIL: admin
          TEST_ADMIN_PASSWORD: admin123
          THROTTLE_SKIP: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/reports/
          retention-days: 30

      - name: Upload test traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7
