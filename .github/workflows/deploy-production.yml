name: Deploy to Hetzner Production

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force full deployment (rebuild everything)'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Deploy to Hetzner Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USERNAME }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e


            echo "📅 $(date)"
            echo "🔗 Commit: ${{ github.sha }}"

              echo "❌ Project directory not found. Running initial setup..."
              cd /root
              git clone --branch develop https://github.com/${{ github.repository }}.git RealEstatesAPI-NestJS
              cd RealEstatesAPI-NestJS
            }

            echo "📥 Pulling latest changes from develop..."
            git fetch origin develop
            git reset --hard origin/develop
            git clean -fd


            echo "🔍 Current commit: $(git rev-parse HEAD)"
            echo "🔍 Expected commit: ${{ github.sha }}"

            echo "🐳 Ensuring Docker services are running..."

            npm ci --prefer-offline --no-audit

            echo "🔧 Building shared packages..."
            cd packages/types && npm run build && cd ../..

            echo "🔧 Building shared packages (api-client)..."
            docker compose up -d postgres redis
            sleep 5

            cd apps/api
            npm run migration:run || echo "⚠️ Migration may have already run or failed"
            cd ../..

            npm ci --prefer-offline

            pm2 kill 2>/dev/null || true

            # Start API
            echo "🚀 Starting API..."
            cd apps/api

            pm2 start npm --name "admin-web" -- start
            cd ../..

            # Start User Web
            echo "🚀 Starting User Web..."
            cd apps/user-web

            cd ../..

            pm2 save
            pm2 startup

            echo "✅ Deployment complete!"
            npm run migration:run || echo "⚠️ Migration may have already run"
            pm2 status

            echo ""

            SERVER_IP=$(hostname -I | awk '{print $1}')
            echo "   API:       http://$SERVER_IP:3000"

            echo "   User Web:  http://$SERVER_IP:3002"

        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}

          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
            echo "🔍 Verifying deployment..."

            # Wait for services to start
            sleep 15

            # Check API health

              echo "✅ API is responding"
              echo "⚠️ API may still be starting..."
              echo "⚠️ API may still be starting or has issues"

            fi


            # Check PM2 processes
            echo ""
            echo "📊 PM2 Status:"



            # Show recent logs
            echo ""
            echo "📋 Recent API logs:"
            pm2 logs api --lines 10 --nostream


      - name: Notify on failure
        if: failure()
            echo "   API:       http://$(hostname -I | awk '{print $1}'):3000"
            echo "   Admin:     http://$(hostname -I | awk '{print $1}'):3001"
            echo "   User Web:  http://$(hostname -I | awk '{print $1}'):3002"
          script: |
            echo "❌ Deployment failed at $(date)"
            echo "Check PM2 logs:"
            pm2 logs --lines 50 --nostream

            echo "🔗 Failed commit: ${{ github.sha }}"
            echo "👤 Failed by: ${{ github.actor }}"
            echo ""
            echo "📋 Recent system logs:"
            journalctl -n 20 --no-pager
            echo ""

            pm2 status 2>/dev/null || echo "PM2 not available"
            sleep 10

            # Check API
            if curl -s http://localhost:3000/v1/properties/public > /dev/null; then
