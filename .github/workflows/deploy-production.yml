name: Deploy to Hetzner Production

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force full deployment (rebuild everything)'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Deploy to Hetzner Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USERNAME }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            
            echo "🚀 Starting deployment..."
            echo "📅 $(date)"
            
            # Navigate to project directory
            cd /root/RealEstatesAPI-NestJS || {
              echo "❌ Project directory not found. Running initial setup..."
              cd /root
              git clone --branch develop https://github.com/${{ github.repository }}.git RealEstatesAPI-NestJS
              cd RealEstatesAPI-NestJS
            }
            
            echo "📥 Pulling latest changes from develop..."
            git fetch origin develop
            git reset --hard origin/develop
            git clean -fd
            
            echo "🐳 Ensuring Docker services are running..."
            docker compose up -d postgres redis
            sleep 5
            
            echo "📦 Installing dependencies..."
            npm ci --prefer-offline
            
            echo "🔧 Building shared packages..."
            cd packages/types && npm run build && cd ../..
            
            echo "🏗️ Building all applications..."
            npm run build
            
            echo "🗄️ Running database migrations..."
            cd apps/api
            npm run migration:run || echo "⚠️ Migration may have already run"
            cd ../..
            
            echo "🔄 Restarting PM2 processes..."
            pm2 delete all 2>/dev/null || true
            
            # Start API
            cd apps/api
            pm2 start dist/main.js --name "api" -i 1
            cd ../..
            
            # Start Admin Web
            cd apps/admin-web
            pm2 start npm --name "admin-web" -- start
            cd ../..
            
            # Start User Web
            cd apps/user-web
            pm2 start npm --name "user-web" -- start
            cd ../..
            
            pm2 save
            
            echo "✅ Deployment complete!"
            echo "📊 PM2 Status:"
            pm2 status
            
            echo ""
            echo "🌐 Services:"
            echo "   API:       http://$(hostname -I | awk '{print $1}'):3000"
            echo "   Admin:     http://$(hostname -I | awk '{print $1}'):3001"
            echo "   User Web:  http://$(hostname -I | awk '{print $1}'):3002"

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USERNAME }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            echo "🔍 Verifying deployment..."
            
            # Wait for services to start
            sleep 10
            
            # Check API
            if curl -s http://localhost:3000/v1/properties/public > /dev/null; then
              echo "✅ API is responding"
            else
              echo "⚠️ API may still be starting..."
            fi
            
            # Check PM2 processes
            pm2 status
            
            # Show recent logs
            echo ""
            echo "📋 Recent API logs:"
            pm2 logs api --lines 10 --nostream

      - name: Notify on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USERNAME }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            echo "❌ Deployment failed at $(date)"
            echo "Check PM2 logs:"
            pm2 logs --lines 50 --nostream
