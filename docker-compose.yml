services:
  postgres:
    image: postgres:16-alpine
    container_name: estates_postgres
    env_file:
      - .env.development
    environment:
      POSTGRES_DB: ${DB_NAME:-estates}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: estates_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # NOTE: For local development, run apps directly via npm:
  # - API:        npm run dev:api        (port 3000)
  # - Admin Web:  npm run dev:admin      (port 3001)
  # - User Web:   npm run dev:user       (port 3002)

volumes:
  postgres_data:


