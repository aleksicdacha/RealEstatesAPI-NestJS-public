services:
  postgres:
    image: postgres:16-alpine
    container_name: estates_postgres
    env_file:
      - .env.development
    environment:
      POSTGRES_DB: ${DB_NAME:-estates}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-estates}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: estates_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  seeder:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: estates_seeder
    env_file:
      - .env.development
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-CHANGE_ME}
      - DB_NAME=${DB_NAME:-estates}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: >
      sh -c "npm install --silent &&
             npx ts-node --project tsconfig.seed.json -r tsconfig-paths/register seeds/seed.ts"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: estates_api
    env_file:
      - .env.development
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-CHANGE_ME}
      - DB_NAME=${DB_NAME:-estates}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-30m}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - THROTTLE_SKIP=${THROTTLE_SKIP:-false}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - ./uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    command: sh -c "npm install && npx nest start --watch"

  # Frontend apps run directly via npm for hot-reload during development:
  # - Admin Web: npm run dev:admin (port 3001)
  # - User Web:  npm run dev:user  (port 3002)

volumes:
  postgres_data:

