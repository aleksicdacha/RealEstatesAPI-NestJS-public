services:
  postgres:
    image: postgres:16-alpine
    container_name: estates_postgres
    environment:
      POSTGRES_DB: real_estate_db
      POSTGRES_USER: real_estate_user
      POSTGRES_PASSWORD: ***REMOVED-BY-SECURITY-CLEANUP***
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: estates_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: estates_api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=real_estate_user
      - DB_PASSWORD=***REMOVED-BY-SECURITY-CLEANUP***
      - DB_NAME=real_estate_db
      - JWT_SECRET=your_super_secret_jwt_key_here_min_32_chars
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    command: npm run start:dev

  admin:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: estates_admin
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
