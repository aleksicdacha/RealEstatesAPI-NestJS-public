# =============================================================================
#  .gitleaks.toml — Gitleaks secret scan configuration
#
#  Extends the default ruleset with allowlists for test/example files
#  that intentionally contain placeholder values.
# =============================================================================

[extend]
# Use the default Gitleaks ruleset as base
useDefault = true

[allowlist]
description = "Ignore placeholder values in example/template files"
paths = [
    # Example and template files with placeholder credentials
    '''.*\.example$''',
    '''.*\.template$''',
    '''.*\.example\.env$''',
    '''\.env\.example''',
    '''msmtp\.conf\.template''',
    # Test files
    '''test-.*\.js$''',
    '''.*\.test\.ts$''',
    '''.*\.spec\.ts$''',
    # Documentation
    '''documentation/.*''',
    '''.*\.md$''',
    # Setup scripts — contain placeholder tokens by design
    '''deploy/server-hardening/setup-server\.sh''',
]

regexes = [
    # Common placeholder patterns
    '''CHANGE_ME''',
    '''REPLACE_WITH''',
    '''YOUR_.*HERE''',
    '''YOUR_EMAIL''',
    '''YOUR_APP_PASSWORD''',
    '''YOUR_GMAIL''',
    '''ghp_REPLACE_WITH_YOUR_GITHUB_PAT''',
    '''CHANGE_ME_STRONG_PASSWORD''',
    '''CHANGE_ME_AT_LEAST_32''',
]
